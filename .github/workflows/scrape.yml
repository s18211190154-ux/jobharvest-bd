name: Scrape jobs + refresh data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual run button
  push:
    branches: [main]          # seed data on first push too

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        run: python scrape.py

      - name: Commit refreshed data
        run: |
          git config user.name "jobharvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes in jobs data."
          else
            git commit -m "🔄 refresh jobs.json — $(date -u +'\\%Y-\\%m-\\%d \\%H:\\%M \\%Z')"
            git push
          fi
